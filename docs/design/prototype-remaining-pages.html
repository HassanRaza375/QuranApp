<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quran revamp · Prototype for remaining pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Nastaliq+Urdu&display=swap">
<style>
:root{
  --paper:#F5F4F0;--surface:#FCFBF8;--sunk:#EEECE6;--ink:#1D2427;--ink-2:#4B565B;--ink-3:#9AA2A5;
  --line:#E1DED6;--line-2:#D2CEC4;--accent:#2B6777;--accent-ink:#fff;--accent-soft:#E2EDEF;
  --gold:#A8833A;--warn:#9A5B1E;--warn-soft:#F6EBDD;--weak:#B4553F;
  --s1:#D9D6CE;--s2:#9DC0C8;--s3:#4E8A99;--s4:#A8833A;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
  --ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --r:10px;--r-s:6px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171A;--surface:#172024;--sunk:#0D1215;--ink:#E4E7E5;--ink-2:#A6B0B2;--ink-3:#5B676B;
  --line:#253035;--line-2:#33403F;--accent:#5CA0AF;--accent-ink:#0C1316;--accent-soft:#1B2E33;
  --gold:#CBA65E;--warn:#E0A35F;--warn-soft:#2C2218;--weak:#D9806B;
  --s1:#2A3438;--s2:#2F5A64;--s3:#5CA0AF;--s4:#CBA65E;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171A;--surface:#172024;--sunk:#0D1215;--ink:#E4E7E5;--ink-2:#A6B0B2;--ink-3:#5B676B;
  --line:#253035;--line-2:#33403F;--accent:#5CA0AF;--accent-ink:#0C1316;--accent-soft:#1B2E33;
  --gold:#CBA65E;--warn:#E0A35F;--warn-soft:#2C2218;--weak:#D9806B;
  --s1:#2A3438;--s2:#2F5A64;--s3:#5CA0AF;--s4:#CBA65E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico.l{width:20px;height:20px}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:18px 12px 24px;background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:500 19px/1 var(--serif)}
.brand b{font:400 22px/1 var(--ar);color:var(--accent)}
.navg{margin:14px 0 4px;padding:0 10px;font-size:12px;color:var(--ink-2)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-s);text-decoration:none;color:var(--ink-2);position:relative}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .built{opacity:.55;pointer-events:none}
.nav small{margin-left:auto;font-size:11px;color:var(--ink-2)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px)}
.top .crumb{font-size:13px;color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb a{text-decoration:none}.top .crumb a:hover{text-decoration:underline}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-s);border:1px solid transparent;background:none;color:var(--ink-2)}
.ib:hover{background:var(--sunk);color:var(--ink)}
.menu-btn{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);font-size:13px;color:var(--ink-2)}
.pill[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.page{max-width:920px;margin:0 auto;padding:32px 28px 120px}
.page.wide{max-width:1080px}
.offline-bar{display:none;align-items:center;gap:8px;padding:8px 28px;background:var(--warn-soft);color:var(--warn);font-size:13px;border-bottom:1px solid var(--line)}
body.offline .offline-bar{display:flex}

/* type */
h1{font:500 34px/1.12 var(--serif);letter-spacing:-.01em;margin:0 0 6px}
h2{font:500 21px/1.25 var(--serif);margin:0 0 12px}
h3{font:600 15px/1.35 var(--sans);margin:0 0 4px}
.lede{color:var(--ink-2);margin:0 0 26px;max-width:62ch}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.ar{font-family:var(--ar);direction:rtl;font-size:26px;line-height:2.05;letter-spacing:0}
.ur{font-family:var(--ur);direction:rtl;line-height:2.3;font-size:18px}
.vend{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;margin:0 .2em;border:1.5px solid var(--gold);border-radius:50%;color:var(--gold);font:600 12px/1 var(--sans);vertical-align:.35em}
.hr{height:1px;background:var(--line);border:0;margin:24px 0}
.section{margin:34px 0 0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-h h2{margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:none;font-size:13px;color:var(--ink-2);text-decoration:none}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{opacity:.7;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.line{background:none;box-shadow:inset 0 0 0 1px var(--line-2)}
.field{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.seg{display:inline-flex;padding:3px;border-radius:8px;background:var(--sunk);gap:2px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.switch{position:relative;width:38px;height:22px;flex:none;border-radius:99px;border:0;background:var(--line-2);transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* cards & lists */
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px}
.card.flat{background:none}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;content-visibility:auto;contain-intrinsic-size:auto 56px}
a.li:hover{background:linear-gradient(90deg,var(--sunk),transparent)}
.li .t{font-weight:500}
.li .s{font-size:13px;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.badge-n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--sunk);font:500 13px/1 var(--sans);color:var(--ink-2);flex:none}
.empty{padding:36px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--ink-2)}
.empty h3{color:var(--ink)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-s);background:var(--sunk);font-size:13px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note .ico{margin-top:2px}

/* the thread: the whole mushaf as one line */
.thread{display:block;width:100%;height:22px}
.thread .trk{fill:var(--sunk)}
.thread .jz{stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke}
.thread .fill{fill:var(--accent);opacity:.85}
.thread .fill.soft{fill:var(--s2);opacity:1}
.thread .mk{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.thread .here{stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.thread-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:4px}

/* search */
.search-hero .field{height:56px;font-size:18px;border-radius:12px;padding:0 16px}
.search-hero .field input{font-size:18px}
.kbd{font:500 11px/1 var(--sans);padding:4px 6px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink-2)}
.jump{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);text-decoration:none;margin-bottom:18px}
.jump .ar{font-size:22px;line-height:1.4}
.rgroup{margin-top:28px}
.rgroup-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rgroup-h h2{margin:0;font-size:18px}
mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.hist{display:flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 12px;border-radius:99px;border:1px solid var(--line-2);font-size:13px}
.hist button{border:0;background:none;color:var(--ink-2);display:grid;place-items:center;width:22px;height:22px;border-radius:50%}
.hist button:hover{background:var(--sunk)}
.hist a{text-decoration:none}

/* downloads */
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.prog{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.parts{display:flex;gap:4px}
.part{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:5px;border:1px solid var(--line-2);font-size:12px;background:none;color:var(--ink-2)}
.part[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.part.done{border-color:transparent;background:var(--sunk);color:var(--ink)}

/* knowledge */
.ktabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 22px;scrollbar-width:none}
.ktabs a{display:flex;align-items:center;gap:8px;padding:10px 12px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ktabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.kcard{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none}
.kcard:hover{border-color:var(--ink-3)}
.kcard .ar{font-size:22px;line-height:1.5;text-align:right}
.kcard .thread{height:12px;margin-top:auto}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);font-size:13px;text-decoration:none;font-variant-numeric:tabular-nums}
.ref:hover{border-color:var(--accent);color:var(--accent)}
.ayah{padding:22px 0;border-bottom:1px solid var(--line)}
.ayah .ar{text-align:right}
.ayah .tr{font:400 17px/1.65 var(--serif);color:var(--ink);margin-top:8px}
.ayah-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.det-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-bottom:20px;border-bottom:1px solid var(--line)}
.det-head .ar{font-size:40px;line-height:1.3;color:var(--accent)}

/* fiqh */
.marja{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.marja .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:500 15px var(--serif)}
.mcard{display:block;width:100%;text-align:left;padding:18px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.mcard:hover{border-color:var(--accent)}
.mcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cat{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;background:var(--surface);min-height:118px}
.cat:hover{border-color:var(--ink-3)}
.cat .ar{font-size:20px;line-height:1.4;color:var(--accent)}
.cat.later{background:none;border-style:dashed;pointer-events:none}
.cat.later .ar{color:var(--ink-2)}
.ruling{padding:18px 0;border-bottom:1px solid var(--line)}
.quote{margin:10px 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 6px 6px 0;font:400 16px/1.6 var(--serif)}
.quote.slot{color:var(--ink-2);font-style:italic}
.src{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:0 0 18px 46px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;color:var(--ink-2);background:var(--surface)}
.steps li::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:1px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.panel{border:1px solid var(--line);border-radius:var(--r);padding:0 16px;background:var(--surface)}
details.panel summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;height:50px;font-weight:500}
details.panel summary::-webkit-details-marker{display:none}
details.panel[open] summary .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}
.az{display:flex;flex-wrap:wrap;gap:2px;margin:14px 0}
.az button{width:30px;height:30px;border:0;border-radius:5px;background:none;color:var(--ink-2);font-size:13px}
.az button:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.az button:disabled{opacity:.3;cursor:default}
.gl{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:16px}

/* hifz */
.hstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:3px}
.hstrip i{aspect-ratio:1;border-radius:3px;background:var(--s1);position:relative}
.hstrip i[data-s="learning"]{background:var(--s2)}
.hstrip i[data-s="memorized"]{background:var(--s3)}
.hstrip i[data-s="strong"]{background:var(--s4)}
.hstrip i[data-s="weak"]{background:none;box-shadow:inset 0 0 0 2px var(--weak)}
.hstrip i[data-t="weak"]::after{content:"";position:absolute;right:-3px;top:35%;width:3px;height:30%;background:var(--weak)}
.hkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.hkey span{display:inline-flex;align-items:center;gap:6px}
.hkey i{width:10px;height:10px;border-radius:2px;display:inline-block}
.today{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:22px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.today .big{font:500 44px/1 var(--serif)}
.sig{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sig div{background:var(--surface);padding:12px 14px}
.sig b{display:block;font:500 20px/1.2 var(--serif)}
.sig span{font-size:12px;color:var(--ink-2)}
.session{max-width:720px;margin:0 auto}
.sbar{display:flex;gap:3px;margin:8px 0 28px}
.sbar i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.sbar i.d{background:var(--accent)}.sbar i.c{background:var(--ink-2)}
.prompt{padding:26px 0 8px;text-align:center}
.prompt .ar{font-size:32px;line-height:2.1}
.hidden-ayah{margin:18px 0;padding:24px;border:1px dashed var(--line-2);border-radius:12px;text-align:center;min-height:120px;display:grid;place-items:center}
.hidden-ayah .ar{font-size:30px}
.hint .ar{font-size:30px;color:var(--ink-2)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.grades button{height:64px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.grades button span{font-size:12px;color:var(--ink-2)}
.grades button:hover{border-color:var(--accent)}

/* goals */
.spine{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.spine i{height:34px;border-radius:2px;background:var(--sunk);position:relative}
.spine i.d{background:var(--accent)}
.spine i.p{background:linear-gradient(90deg,var(--accent) var(--p),var(--sunk) var(--p))}
.spine-l{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;font-size:10px;color:var(--ink-2);text-align:center;margin-top:4px}
.week{display:flex;gap:8px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--ink-2)}
.week i{display:block;height:36px;border-radius:6px;margin-bottom:4px;background:var(--sunk);position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.week i.off{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,transparent 4px 8px)}
.week .tdy{color:var(--ink);font-weight:600}
.gtype{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.gtype[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden;background:var(--surface)}
.stepper button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center}
.stepper button:hover{background:var(--sunk)}
.stepper input{width:64px;height:38px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;background:none;font-variant-numeric:tabular-nums}
.preview{padding:16px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.preview b{font:500 30px/1.1 var(--serif);color:var(--accent)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-head h1{flex:1;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:8px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal button{position:relative;min-height:86px;padding:8px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.cal button:hover{background:var(--sunk)}
.cal button.pad{background:none;pointer-events:none}
.cal .h{font:500 22px/1 var(--serif)}
.cal .g{font-size:11px;color:var(--ink-2)}
.cal .ev{margin-top:auto;display:flex;gap:3px;flex-wrap:wrap}
.cal .ev i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal .ev i.r{background:none;box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.cal button.is-today .h{color:var(--accent)}
.cal button.is-today::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--accent);border-radius:6px;pointer-events:none}
.cal button[aria-pressed="true"]{background:var(--accent-soft)}
.cal-layout{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
.cal.gfirst .h{font:500 18px/1 var(--sans)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.45);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-48%);width:min(520px,calc(100vw - 32px));max-height:min(86vh,720px);overflow:auto;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);padding:22px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{flex:1;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:70;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--paper);font-weight:600;text-decoration:underline;padding:6px 8px}
.proto{font-size:12px;color:var(--ink-2);padding:14px 10px 0;border-top:1px solid var(--line);margin-top:18px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);padding:8px 12px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:55;transform:translateX(-100%);transition:transform .2s;background:var(--paper)}
  body.nav-open .side{transform:none}
  .menu-btn{display:inline-grid}
  .top{padding:8px 14px}
  .page{padding:22px 16px 110px}
  .offline-bar{padding:8px 16px}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-layout{grid-template-columns:1fr}
  .sig{grid-template-columns:repeat(2,1fr)}
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;transform:translateY(100%);border-radius:16px 16px 0 0;max-height:88vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .sheet.open{transform:none}
}
@media (max-width:600px){
  h1{font-size:28px}
  .g2,.g3{grid-template-columns:1fr}
  .cal button{min-height:62px;padding:5px}
  .cal .h{font-size:18px}
  .gl{grid-template-columns:1fr;gap:4px}
  .det-head{grid-template-columns:1fr}
  .det-head .ar{text-align:left}
  .today{grid-template-columns:1fr}
  .grades button{height:56px}
  .spine i{height:26px}
  .spine-l span:nth-child(even){visibility:hidden}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* normalisation: Arabic marks, Latin diacritics, apostrophes, letter forms */
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ک/g,"ك").replace(/ی/g,"ي").replace(/['’ʿʾ`\-]/g,"").toLowerCase();
function hl(text,q){
  const nq=norm(q).replace(/\s+/g," ").trim(); if(!nq) return esc(text);
  const V={"ا":"[اأإآٱ]","ي":"[يىی]","ه":"[هة]","ك":"[كک]"};
  const pat=[...nq].map(ch=>ch===" "?"\\s+":V[ch]||ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[\\u064B-\\u065F\\u0670\\u06D6-\\u06ED\\u0640'’ʿʾ\\-]*");
  try{return esc(text).replace(new RegExp(`(${pat})`,"ig"),"<mark>$1</mark>")}catch{return esc(text)}
}

/* the thread: whole mushaf as one line */
function thread({fills=[],marks=[],here=null,soft=false,scale=false}={}){
  const jz=JUZ.slice(1).map(p=>`<line class="jz" x1="${p}" x2="${p}" y1="4" y2="18"/>`).join("");
  const f=fills.map(([a,b])=>`<rect class="fill${soft?" soft":""}" x="${a-1}" y="6" width="${Math.max(b-a+1,4)}" height="10" rx="2"/>`).join("");
  const m=marks.map(p=>`<line class="mk" x1="${p}" x2="${p}" y1="2" y2="20"/>`).join("");
  const h=here?`<line class="here" x1="${here}" x2="${here}" y1="0" y2="22"/>`:"";
  return `<svg class="thread" viewBox="0 0 ${TOTAL} 22" preserveAspectRatio="none" role="img" aria-label="Position in the Qur'an"><rect class="trk" x="0" y="6" width="${TOTAL}" height="10" rx="5"/>${jz}${f}${m}${h}</svg>`+(scale?`<div class="thread-scale"><span>Al-Fatihah</span><span>Juz 15</span><span>An-Nas</span></div>`:"");
}

function queueHTML(){return DL.queue.map(q=>`<div class="li"><span class="badge-n num">${q.s}</span><div class="grow"><div class="row"><div class="t grow">${NAMES[q.s-1]}</div><span class="small muted num">${q.wait?"Waiting for Wi-Fi":Math.round(q.p)+"%"}</span></div><div class="prog"><i style="width:${q.p}%"></i></div></div><button class="ib" data-a="dl-cancel" data-s="${q.s}" aria-label="Cancel">${I("x")}</button></div>`).join("")}

}

   <p class="small muted">At your pace, you'll finish around <b style="color:var(--ink)">${fmtD(addD(TODAY,Math.ceil((TOTAL-pos)/(pos/21))))} 2027</b>. ${daysLeft} days to your date; ${target} ayahs a day keeps you on it.</p></div>
  <div class="section"><h2>This week</h2><div class="week">${week.map(d=>{const v=G.log[dkey(d)]||0,off=!G.days.includes(d.getDay());return `<div class="${dkey(d)===dkey(TODAY)?"tdy":""}"><i class="${off?"off":""}" title="${v} ayahs"><b style="height:${v/max*100}%"></b></i>${"SMTWTFS"[d.getDay()]}<br><span class="num">${v||"–"}</span></div>`}).join("")}</div>
   <p class="small muted">The line is today's amount (${target}). Days you read less are simply days; the daily amount adjusts to keep your date.</p></div>

const CAL={m:1,sel:null,gfirst:false,rem:store.get("quran:cal-rem-proto",[{id:1,title:"Visit family",date:"2026-10-25",yearly:false}])};
function hijriOf(d){for(const m of HMONTHS){const s=parseD(m.start),i=daysBetween(s,d);if(i>=0&&i<m.len)return {m,day:i+1}}return null}
function pgCal(){
  const M=HMONTHS[CAL.m],start=parseD(M.start),lead=start.getDay();

  const sel=CAL.sel?parseD(CAL.sel):(hijriOf(TODAY)&&hijriOf(TODAY).m===M?TODAY:start);
  const ev=d=>{const h=hijriOf(d);const e=h&&HEVENTS[`${h.m.n}:${h.day}`];const r=CAL.rem.filter(x=>x.date===dkey(d));return {e,r}};
  const sh=hijriOf(sel),se=ev(sel);
  const upcoming=[];HMONTHS.forEach(m=>Object.entries(HEVENTS).forEach(([k,v])=>{const [mn,dd]=k.split(":");if(mn===m.n){const d=addD(parseD(m.start),+dd-1);if(d>=TODAY)upcoming.push([d,v[0],`${dd} ${m.n}`])}}));
  CAL.rem.forEach(r=>{const d=parseD(r.date);if(d>=TODAY)upcoming.push([d,r.title,"Your reminder",r.id])});upcoming.sort((a,b)=>a[0]-b[0]);

  <div class="row wrap" style="margin:-8px 0 18px"><span class="ar" style="font-size:22px;line-height:1.4;color:var(--accent)">${M.ar}</span><span class="small muted grow num">${fmtD(start)} – ${fmtD(gEnd)} ${gEnd.getFullYear()} · Umm al-Qura, adjusted −0 days</span><div class="seg" role="group" aria-label="Number shown first"><button data-a="cal-g" data-v="0" aria-pressed="${!CAL.gfirst}">Hijri</button><button data-a="cal-g" data-v="1" aria-pressed="${CAL.gfirst}">Gregorian</button></div></div>
  <div class="cal-layout"><div><div class="cal ${CAL.gfirst?"gfirst":""}" role="grid">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="dow">${d}</div>`).join("")}${"<button class='pad' tabindex='-1' aria-hidden='true'></button>".repeat(lead)}
   ${days.map((d,i)=>{const {e,r}=ev(d),isT=dkey(d)===dkey(TODAY);return `<button data-a="cal-sel" data-d="${dkey(d)}" class="${isT?"is-today":""}" aria-pressed="${dkey(d)===dkey(sel)}" aria-label="${i+1} ${M.n}, ${fmtD(d)}${e?", "+e[0]:""}${r.length?", "+r.length+" reminder":""}"><span class="h num">${CAL.gfirst?d.getDate():i+1}</span><span class="g num">${CAL.gfirst?(i+1)+" "+M.n.split(" ").pop().slice(0,5):(d.getDate()===1||i===0?MON[d.getMonth()]+" ":"")+(CAL.gfirst?"":d.getDate())}</span><span class="ev">${e?"<i></i>":""}${r.map(()=>"<i class='r'></i>").join("")}</span></button>`}).join("")}</div>
   <div class="hkey" style="margin-top:10px"><span><i style="background:var(--accent);border-radius:50%"></i>Islamic event</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--ink-2);border-radius:50%"></i>Your reminder</span></div></div>
  <aside><div class="card"><div class="small muted">${dkey(sel)===dkey(TODAY)?"Today":["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][sel.getDay()]}</div><h2 style="margin:2px 0 0">${sh?sh.day+" "+sh.m.n:""}</h2><div class="muted small num">${fmtD(sel)} ${sel.getFullYear()}</div>
   <div style="margin-top:14px">${se.e?`<div class="li" style="padding:10px 0">${I("star")}<div class="grow"><div class="t">${se.e[0]}</div>${se.e[1]?`<div class="s">${se.e[1]}</div>`:""}</div></div>`:""}${se.r.map(r=>`<div class="li" style="padding:10px 0">${I("bell")}<div class="grow t">${esc(r.title)}</div><button class="ib" data-a="rem-del" data-id="${r.id}" aria-label="Remove reminder">${I("trash")}</button></div>`).join("")}${!se.e&&!se.r.length?`<p class="small muted" style="margin:0 0 10px">Nothing on this day.</p>`:""}</div>
   <button class="btn" style="width:100%;margin-top:8px" data-a="rem-add">${I("plus")}Add reminder</button></div>
   <div class="section"><h3>Coming up</h3><div class="list">${upcoming.slice(0,5).map(([d,t,s,id])=>`<div class="li"><span class="badge-n num" style="width:auto;padding:0 8px">${fmtD(d)}</span><div class="grow"><div class="t">${esc(t)}</div><div class="s">${s} · in ${daysBetween(TODAY,d)} days</div></div></div>`).join("")}</div>
   <p class="small muted">Reminders show here and on Home while the app is open.</p></div></aside></div>
  </div>`;
}

/* ---------- router ---------- */
const route=()=>(location.hash.slice(1)||"/search").split("?")[0];
const TITLES={"/search":"Search","/downloads":"Downloads","/fiqh":"Daily Fiqh","/hifz":"Hifz","/goals":"Reading goals","/calender":"Calendar"};
function render(){
  const p=route(),parts=p.split("/").filter(Boolean);let html;
  if(p==="/search")html=pgSearch();
  else if(p==="/downloads")html=pgDownloads();
  else if(parts[0]==="k")html=parts[2]?pgKDetail(parts[1],parts[2]):pgKList(parts[1]);
  else if(p==="/fiqh")html=pgFiqh();
  else if(p==="/fiqh/choose-marja")html=pgChooseMarja();
  else if(p==="/fiqh/glossary")html=pgGlossary();
  else if(parts[0]==="fiqh"&&parts.length===2)html=pgCategory(parts[1]);
  else if(parts[0]==="fiqh"&&parts.length===3)html=pgTopic(parts[1],parts[2]);
  else if(p==="/hifz")html=pgHifz();
  else if(p==="/hifz/session")html=pgSession();
  else if(p==="/goals")html=pgGoals();
  else if(p==="/calender")html=pgCal();
  else html=notFound();
  $("#view").innerHTML=html;
  renderNav(p);
  const M=MODULES.find(m=>m.id===parts[1]);
  $("#crumb").innerHTML=parts[0]==="k"?`<a href="#/k/${parts[1]}">${M?M.title:""}</a>`:esc(TITLES["/"+parts[0]]||"");
  document.title=($("#view h1")?.textContent||"Quran")+" · Prototype";
  if(p==="/search")runSearch();
}
